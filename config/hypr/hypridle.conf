# hypridle is intentionally reduced to *only* backlight dimming.
#
# noctalia (>= v5) owns idle, locking, screen-off and suspend on its own:
#   - it holds its own logind sleep-delay inhibit ("Lock before sleep")
#   - it runs its own logind session-lock monitor, so `loginctl lock-session`
#     reaches it directly without any helper command
#   - it runs its own idle daemon (lock / screen_off / suspend behaviours)
# Configure those timeouts in noctalia Settings -> Idle, *not* here.
#
# Having hypridle drive the same things caused two independent sleep-delay
# inhibitors to race on suspend, and the old `lock_cmd` could never work
# anyway: `qs` ships from noctalia-qs-legacy and aborts with a Qt symbol
# lookup error, so the lock only ever happened via noctalia's logind monitor.

general {
    inhibit_sleep = 0   # do NOT take a sleep-delay lock; noctalia holds that one

    # Kept as a safety net: bring displays back after resume even if something
    # left DPMS off. Locking itself is handled entirely by noctalia.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 150                                          # 2.5min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}
