# hypridle owns idle: dim, lock, screen-off and suspend.
#
# dux (dms) has its own idle timers, but they are all left at 0 (disabled) and its
# "lock before suspend" is off, so hypridle is the only thing holding a sleep-delay
# inhibitor. Keep it that way -- two inhibitors racing on suspend was the reason
# hypridle was dropped once before (b889590). If you enable idle in dux Settings,
# remove this file and its autostart line instead.
#
# Locking goes through logind: `loginctl lock-session` is picked up by dux's
# loginctl lock integration, which shows the dux lock screen.

general {
    lock_cmd = dms ipc call lock lock          # runs on logind Lock (loginctl lock-session)
    before_sleep_cmd = loginctl lock-session   # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false                # respect video players / browsers
    inhibit_sleep = 3                          # hold suspend until the session is locked
}

# 2.5 min: dim the screen (avoid 0 on OLED)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 2.5 min: keyboard backlight off (remove if there is none)
listener {
    timeout = 150
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
    on-resume = brightnessctl -rd rgb:kbd_backlight
}

# 10 min: lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min: screens off
listener {
    timeout = 660
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 15 min: suspend
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
