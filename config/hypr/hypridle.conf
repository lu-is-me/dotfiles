general {
    lock_cmd = qs -c noctalia-shell ipc call lockScreen lock   # noctalia lock screen
    before_sleep_cmd = loginctl lock-session                   # lock before suspend (routes through lock_cmd)
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # wake display after sleep
}
listener {
    timeout = 150                                # 2.5min.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}
# turn off keyboard backlight, comment out this section if you dont have a keyboard backlight.
listener {
    timeout = 150                                          # 2.5min.
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0 # turn off keyboard backlight.
    on-resume = brightnessctl -rd rgb:kbd_backlight        # turn on keyboard backlight.
}
listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}
listener {
    timeout = 330                                 # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'  # screen off
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'    # screen on
}
listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}
