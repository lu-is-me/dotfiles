max-gamma = 150

# Morning: brief warm ease-in, full daylight by 08:00
# (wake 06:30, at PC ~07:15)
profile {
    time = 7:00
    temperature = 3500
}
profile {
    time = 7:30
    temperature = 4800
}
profile {
    time = 8:00
    identity = true
}

# Evening: ease down from sunset, warmest+dimmest by 21:00
# (bedtime 22:00–22:30)
profile {
    time = 17:30
    temperature = 5500
}
profile {
    time = 18:30
    temperature = 5000
}
profile {
    time = 19:30
    temperature = 4500
    gamma = 0.9
}
profile {
    time = 20:30
    temperature = 3500
    gamma = 0.85
}
profile {
    time = 21:00
    temperature = 2800
    gamma = 0.8
}
