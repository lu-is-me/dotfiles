# Session vars for the systemd user manager. hl.env() in hypr/config/env_vars.lua only
# reaches processes Hyprland spawns; dux (dms.service) and the apps it launches via
# `systemd-run --user --scope` inherit this environment instead. Without
# XDG_SESSION_TYPE, Electron flatpaks (e.g. teams-for-linux) pick X11 and exit.
XDG_SESSION_TYPE=wayland
ELECTRON_OZONE_PLATFORM_HINT=auto
